name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-crypto-test:
    name: Offline tools (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run offline self-tests and integration tests
        run: |
          python seed.py --self-test
          python combine.py --self-test
          python verify_result.py --self-test
          python -m unittest discover -s tests -v

  source-integrity:
    name: Source and release integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n ./*.sh scripts/*.sh tests/*.sh
          bash tests/test_config_loader.sh
          bash tests/test_result_directory.sh
          bash tests/test_search_shard.sh
          bash tests/test_inverse_chain.sh
          bash tests/test_split_variant_hash.sh
          bash tests/test_runtime_scripts.sh

      - name: Validate generated elliptic-curve table
        run: python scripts/verify_precomp.py

      - name: Check for tracked private material
        run: python scripts/scan_sensitive.py

      - name: Verify deterministic source package
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct)"
          ./scripts/package_worker.sh
          first="$(sha256sum dist/vaddro-worker-linux-x86_64.tar.gz)"
          ./scripts/package_worker.sh
          second="$(sha256sum dist/vaddro-worker-linux-x86_64.tar.gz)"
          test "$first" = "$second"
