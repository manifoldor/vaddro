name: Bug report
description: Report a reproducible Vaddro defect without disclosing private material.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach seed files, private keys, final wallet files, or production result files.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, GPU model, NVIDIA driver, CUDA toolkit, and Python versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use only synthetic test keys and redact public addresses if needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Secret-safety confirmation
      options:
        - label: I confirmed this report contains no private key, seed, or wallet file.
          required: true
